name: Restore RenderKit 1.1.4 README

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
    paths:
      - .github/workflows/restore-readme-1.1.4.yml

permissions:
  contents: write

jobs:
  restore:
    if: ${{ github.event.pull_request.head.ref == '1.1.4' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: 1.1.4
          fetch-depth: 0
          persist-credentials: true

      - name: Restore README and apply 1.1.4 metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git fetch origin main
          git show origin/main:README.md | Set-Content -LiteralPath README.md -Encoding utf8
          $content = Get-Content -LiteralPath README.md -Raw -Encoding utf8
          $content = $content.Replace('Current repository version: **1.1.2**', 'Current repository version: **1.1.4**')
          $content = $content.Replace('command exported by the 1.1.0 manifest', 'command exported by the 1.1.4 manifest')
          [System.IO.File]::WriteAllText((Join-Path $env:GITHUB_WORKSPACE 'README.md'), $content, [System.Text.UTF8Encoding]::new($false))

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- README.md
          git commit -m 'fix(release): restore README metadata for 1.1.4 [skip changelog]'
          git push origin HEAD:1.1.4
