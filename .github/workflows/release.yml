name: Release RenderKit

on:
  push:
    branches:
      - main
    paths:
      - 'RenderKit.psd1'

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build Package
    runs-on: windows-latest

    defaults:
      run:
        shell: pwsh

    outputs:
      version: ${{ steps.build.outputs.VERSION }}
      nupkg_path: ${{ steps.build.outputs.NUPKG_PATH }}
      nupkg_name: ${{ steps.build.outputs.NUPKG_NAME }}
      stage_path: ${{ steps.build.outputs.STAGE_PATH }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '8.0.x'

      - name: Execute Build
        id: build
        run: |
          $result = & ./build/Build-RenderKitPackage.ps1 -RepositoryRoot $env:GITHUB_WORKSPACE

          "VERSION=$($result.Version)"                          >> $env:GITHUB_OUTPUT
          "NUPKG_PATH=$($result.PackagePath)"                   >> $env:GITHUB_OUTPUT
          "NUPKG_NAME=$(Split-Path $result.PackagePath -Leaf)"  >> $env:GITHUB_OUTPUT
          "STAGE_PATH=$($result.StagePath)"                     >> $env:GITHUB_OUTPUT

      - name: Upload .nupkg artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: RenderKit-${{ steps.build.outputs.VERSION }}-nupkg
          path: ${{ steps.build.outputs.NUPKG_PATH }}
          if-no-files-found: error

      - name: Upload staged module artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: RenderKit-${{ steps.build.outputs.VERSION }}-stage
          path: ${{ steps.build.outputs.STAGE_PATH }}
          if-no-files-found: error

  package-compatibility:
    name: Validate supported installers
    needs: build
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Download .nupkg artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: RenderKit-${{ needs.build.outputs.version }}-nupkg
          path: ./artifacts

      - name: Validate PSResourceGet installation
        shell: pwsh
        run: |
          $package = Get-Item ./artifacts/*.nupkg
          ./build/Test-RenderKitLocalInstall.ps1 `
            -PackagePath $package.FullName `
            -Version '${{ needs.build.outputs.version }}' `
            -PackageManager PSResourceGet

      - name: Install PowerShellGet 2.2.5
        shell: powershell
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force
          Install-Module -Name PowerShellGet -RequiredVersion 2.2.5 -Scope CurrentUser -Force -AllowClobber

      - name: Validate PowerShellGet installation
        shell: powershell
        run: |
          Import-Module PowerShellGet -RequiredVersion 2.2.5 -Force
          $package = Get-Item ./artifacts/*.nupkg
          ./build/Test-RenderKitLocalInstall.ps1 `
            -PackagePath $package.FullName `
            -Version '${{ needs.build.outputs.version }}' `
            -PackageManager PowerShellGet

  github-release:
    name: GitHub Release
    needs: build
    runs-on: windows-latest

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Download .nupkg artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: RenderKit-${{ needs.build.outputs.version }}-nupkg
          path: ./artifacts

      - name: Extract release notes from CHANGELOG.md
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          $version = $env:VERSION
          $changelogPath = Join-Path $env:GITHUB_WORKSPACE 'CHANGELOG.md'
          $releaseNotesPath = Join-Path $env:RUNNER_TEMP 'release-notes.md'

          if (-not (Test-Path -LiteralPath $changelogPath -PathType Leaf)) {
              throw "CHANGELOG.md not found: $changelogPath"
          }

          $changelog = Get-Content `
            -LiteralPath $changelogPath `
            -Raw `
            -Encoding utf8

          $escapedVersion = [regex]::Escape($version)

          # Supported Headers
          # ## 1.0.1
          # ## v1.0.1
          # ## [1.0.1]
          # ## [v1.0.1] - 2026-07-11
          $pattern = (
              '(?m)^##\s+' +
              "(?:v?$escapedVersion|\[v?$escapedVersion\])" +
              '(?=\s|$)[^\r\n]*\r?\n' +
              '(?<body>[\s\S]*?)' +
              '(?=^##\s+|\z)'
          )

          $matches = [regex]::Matches($changelog, $pattern)

          if ($matches.Count -eq 0) {
              throw @"
          No changelog entry found for version $version.

          Expected a heading such as:
          ## [$version] - YYYY-MM-DD
          "@
          }

          if ($matches.Count -gt 1) {
              throw "Found multiple CHANGELOG.md entries for version $version."
          }

          $changelogNotes = $matches[0].Groups['body'].Value.Trim()

          if ([string]::IsNullOrWhiteSpace($changelogNotes)) {
              throw "The CHANGELOG.md entry for version $version is empty."
          }

          $commit = '${{ github.sha }}'
          $shortCommit = $commit.Substring(0, 7)
          $releaseDate = [DateTime]::UtcNow.ToString(
              'yyyy-MM-dd HH:mm UTC'
          )

          $releaseNotes = @"
          ## RenderKit v$version

          - **Commit:** $shortCommit
          - **Date:** $releaseDate
          - **Branch:** main

          $changelogNotes
          "@

          Set-Content `
            -LiteralPath $releaseNotesPath `
            -Value $releaseNotes.Trim() `
            -Encoding utf8

          "RELEASE_NOTES_PATH=$releaseNotesPath" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          Write-Host "Extracted release notes for version ${version}:"
          Write-Host ''
          Write-Host $releaseNotes

      - name: Check if release exists
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "v${{ needs.build.outputs.version }}"

          gh release view `
            $tag `
            --repo '${{ github.repository }}' `
            2>&1 |
            Out-Null

          if ($LASTEXITCODE -eq 0) {
              "EXISTS=true" >> $env:GITHUB_OUTPUT
          }
          else {
              "EXISTS=false" >> $env:GITHUB_OUTPUT
          }

          exit 0

      - name: Reject duplicate release version
        if: steps.check.outputs.EXISTS == 'true'
        run: |
          throw "Release v${{ needs.build.outputs.version }} already exists. Bump RenderKit.psd1 before publishing another release."

      - name: Create GitHub Release
        if: steps.check.outputs.EXISTS == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "v${{ needs.build.outputs.version }}"
          $nupkg = "./artifacts/${{ needs.build.outputs.nupkg_name }}"
          $commit = '${{ github.sha }}'

          gh release create `
            $tag `
            $nupkg `
            --repo '${{ github.repository }}' `
            --target $commit `
            --title "RenderKit $tag" `
            --notes-file $env:RELEASE_NOTES_PATH

  github-packages:
    name: Publish to GitHub Packages
    needs: build
    runs-on: windows-latest

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Download .nupkg artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: RenderKit-${{ needs.build.outputs.version }}-nupkg
          path: ./artifacts

      - name: Push to GitHub Packages
        run: |
          $nupkg = "./artifacts/${{ needs.build.outputs.nupkg_name }}"

          dotnet nuget push $nupkg `
            --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" `
            --api-key ${{ secrets.GITHUB_TOKEN }} `
            --skip-duplicate

  psgallery:
    name: Publish to PowerShell Gallery
    needs: [build, github-release, package-compatibility]
    runs-on: windows-latest

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Download staged module
        uses: actions/download-artifact@v8.0.1
        with:
          name: RenderKit-${{ needs.build.outputs.version }}-stage
          path: ./stage

      - name: Ensure PSResourceGet and PSGallery are available
        run: |
          Import-Module Microsoft.PowerShell.PSResourceGet -Force

          # Repository-Store-Verzeichnis anlegen, falls nicht vorhanden
          $storePath = Join-Path $env:LOCALAPPDATA 'PSResourceGet'
          if (-not (Test-Path $storePath)) {
              New-Item -Path $storePath -ItemType Directory -Force | Out-Null
          }

          # PSGallery registrieren (idempotent)
          if (-not (Get-PSResourceRepository -Name PSGallery -ErrorAction SilentlyContinue)) {
              Register-PSResourceRepository -PSGallery -Trusted
          }

          Get-PSResourceRepository -Name PSGallery

      - name: Publish to PSGallery
        env:
          NUGETAPIKEY: ${{ secrets.NUGETAPIKEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NUGETAPIKEY)) {
              throw 'Missing repository secret NUGETAPIKEY.'
          }

          $manifest = Get-ChildItem -Path ./stage -Filter RenderKit.psd1 -File -Recurse
          if (@($manifest).Count -ne 1) {
              throw "Expected exactly one staged RenderKit manifest, found $(@($manifest).Count)."
          }

          Publish-PSResource `
            -Path $manifest.Directory.FullName `
            -Repository PSGallery `
            -ApiKey $env:NUGETAPIKEY

  gallery-validation:
    name: Validate PSGallery installation
    needs: [build, psgallery]
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Validate with PSResourceGet
        shell: pwsh
        run: |
          ./build/Test-RenderKitGalleryInstall.ps1 `
            -Version '${{ needs.build.outputs.version }}' `
            -PackageManager PSResourceGet

      - name: Install PowerShellGet 2.2.5
        shell: powershell
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force
          Install-Module -Name PowerShellGet -RequiredVersion 2.2.5 -Scope CurrentUser -Force -AllowClobber

      - name: Validate with PowerShellGet 2.2.5
        shell: powershell
        run: |
          Import-Module PowerShellGet -RequiredVersion 2.2.5 -Force
          ./build/Test-RenderKitGalleryInstall.ps1 `
            -Version '${{ needs.build.outputs.version }}' `
            -PackageManager PowerShellGet
