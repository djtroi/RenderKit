name: Prepare RenderKit 1.1.4

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  prepare:
    if: ${{ github.event.pull_request.head.ref == '1.1.4' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout 1.1.4
        uses: actions/checkout@v7.0.1
        with:
          ref: 1.1.4
          fetch-depth: 0
          persist-credentials: true

      - name: Prepare corrective release
        run: |
          $ErrorActionPreference = 'Stop'
          $utf8NoBom = [System.Text.UTF8Encoding]::new($false)

          function Read-RepoFile([string]$Path) {
            [System.IO.File]::ReadAllText((Join-Path $env:GITHUB_WORKSPACE $Path))
          }

          function Write-RepoFile([string]$Path, [string]$Content) {
            [System.IO.File]::WriteAllText(
              (Join-Path $env:GITHUB_WORKSPACE $Path),
              $Content,
              $utf8NoBom
            )
          }

          # Manifest -> 1.1.4.
          $manifestPath = 'RenderKit.psd1'
          $manifest = Read-RepoFile $manifestPath
          if (-not $manifest.Contains("ModuleVersion = '1.1.3'")) {
            throw 'Expected ModuleVersion 1.1.3 was not found.'
          }
          $manifest = $manifest.Replace("ModuleVersion = '1.1.3'", "ModuleVersion = '1.1.4'")
          $releaseNotes = @(
            "            ReleaseNotes = @'",
            'Version 1.1.4 is a corrective release of the RenderKit 1.1.3 feature set:',
            '- Republishes the current Core payload after fixing release validation and version-consistency metadata.',
            '- Requires a fully successful Quality Gate before any release publication can start.',
            '- Prevents an already published version from entering the publication pipeline again.',
            '- Contains no additional runtime feature changes beyond the RenderKit 1.1.3 feature set.',
            "'@"
          ) -join "`n"
          $manifest = [regex]::Replace(
            $manifest,
            "(?s)            ReleaseNotes = @'\r?\n.*?\r?\n'@",
            $releaseNotes,
            1
          )
          Write-RepoFile $manifestPath $manifest

          # README release metadata.
          $readmePath = 'README.md'
          $readme = Read-RepoFile $readmePath
          $readme = $readme.Replace('Current repository version: **1.1.2**', 'Current repository version: **1.1.4**')
          $readme = $readme.Replace('command exported by the 1.1.0 manifest', 'command exported by the 1.1.4 manifest')
          Write-RepoFile $readmePath $readme

          # Remove hard-coded module version from backup-profile test.
          $backupTestPath = 'Tests/Backup/RenderKit.BackupConfigProfile.Tests.ps1'
          $backupTest = Read-RepoFile $backupTestPath
          $oldAssertion = '$upgrade.ModuleVersion | Should -Be ''1.1.2'''
          $newAssertion = '$upgrade.ModuleVersion | Should -Be (Get-Module RenderKit).Version.ToString()'
          if (-not $backupTest.Contains($oldAssertion)) {
            throw 'Expected hard-coded backup-profile ModuleVersion assertion was not found.'
          }
          $backupTest = $backupTest.Replace($oldAssertion, $newAssertion)
          Write-RepoFile $backupTestPath $backupTest

          # Require canonical bracketed Keep a Changelog release headings.
          $docsTestPath = 'Tests/Documentation/RenderKit.Documentation.Tests.ps1'
          $docsTest = Read-RepoFile $docsTestPath
          $oldChangelogAssertion = '$changelog | Should -Match "(?m)^## $version(?:\s|$)"'
          $newChangelogAssertion = '$changelog | Should -Match "(?m)^## \[$version\](?:\s|$)"'
          if (-not $docsTest.Contains($oldChangelogAssertion)) {
            throw 'Expected legacy changelog heading assertion was not found.'
          }
          $docsTest = $docsTest.Replace($oldChangelogAssertion, $newChangelogAssertion)
          Write-RepoFile $docsTestPath $docsTest

          # Cut 1.1.4 while leaving Unreleased empty.
          $changelogPath = 'CHANGELOG.md'
          $changelog = Read-RepoFile $changelogPath
          $releaseSection = @'
          ### Security

          ## [1.1.4] - 2026-08-07

          ### Changed

          - Release publication now starts only after the complete `Quality Gate` workflow succeeds for the `main` commit being released, and the release build checks out that exact validated commit.

          ### Fixed

          - Fixed stale release-version assertions and README metadata left at `1.1.2` after the `1.1.3` release cut.
          - Fixed release-documentation validation to recognize the canonical Keep a Changelog heading format (`## [version]`).
          - Prevented an already published module version from entering the release publication pipeline again.

          ## [1.1.3] - 2026-07-31
          '@
          $changelogBoundary = '(?m)^### Security\r?\n\r?\n## \[1\.1\.3\] - 2026-07-31'
          if ($changelog -notmatch $changelogBoundary) {
            throw 'Expected Unreleased/1.1.3 changelog boundary was not found.'
          }
          $changelog = [regex]::Replace($changelog, $changelogBoundary, $releaseSection.TrimEnd(), 1)
          Write-RepoFile $changelogPath $changelog

          # Release workflow: successful Quality Gate on main is the hard gate.
          $releasePath = '.github/workflows/release.yml'
          $release = Read-RepoFile $releasePath
          $triggerPattern = '(?ms)^on:\r?\n  push:\r?\n    branches:\r?\n      - main\r?\n'
          $triggerReplacement = @'
          on:
            workflow_run:
              workflows:
                - Quality Gate
              types:
                - completed
              branches:
                - main
          '@
          if ($release -notmatch $triggerPattern) {
            throw 'Expected push-to-main release trigger was not found.'
          }
          $release = [regex]::Replace($release, $triggerPattern, ($triggerReplacement.TrimEnd() + "`n"), 1)

          # Build GitHub expressions at runtime so this preparation workflow does not evaluate them.
          $headShaExpression = '$' + '{{ github.event.workflow_run.head_sha }}'
          $workflowGateExpression = '$' + "{{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' }}"
          $shouldReleaseExpression = '$' + "{{ needs.preflight.outputs.should_release == 'true' }}"
          $githubTokenExpression = '$' + '{{ secrets.GITHUB_TOKEN }}'
          $outputVersionExpression = '$' + '{{ steps.release.outputs.version }}'
          $outputShouldReleaseExpression = '$' + '{{ steps.release.outputs.should_release }}'

          $preflight = @'
            preflight:
              name: Verify release eligibility
              if: __WORKFLOW_GATE__
              runs-on: windows-latest
              outputs:
                version: __OUTPUT_VERSION__
                should_release: __OUTPUT_SHOULD_RELEASE__
              defaults:
                run:
                  shell: pwsh

              steps:
                - name: Checkout validated commit
                  uses: actions/checkout@v7.0.1
                  with:
                    ref: __HEAD_SHA__
                    fetch-depth: 0
                    persist-credentials: false

                - name: Determine release version
                  id: release
                  env:
                    GH_TOKEN: __GITHUB_TOKEN__
                  run: |
                    $ErrorActionPreference = 'Stop'
                    $manifest = Import-PowerShellDataFile ./RenderKit.psd1
                    $version = [string]$manifest.ModuleVersion
                    if ([string]::IsNullOrWhiteSpace($version)) {
                      throw 'RenderKit.psd1 does not declare ModuleVersion.'
                    }

                    "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

                    gh release view "v$version" --repo $env:GITHUB_REPOSITORY *> $null
                    if ($LASTEXITCODE -eq 0) {
                      Write-Host "RenderKit v$version is already published; skipping all publication jobs."
                      "should_release=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
                      exit 0
                    }

                    Write-Host "RenderKit v$version is not published yet; release is eligible."
                    "should_release=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          '@
          $preflight = $preflight.Replace('__WORKFLOW_GATE__', $workflowGateExpression)
          $preflight = $preflight.Replace('__HEAD_SHA__', $headShaExpression)
          $preflight = $preflight.Replace('__GITHUB_TOKEN__', $githubTokenExpression)
          $preflight = $preflight.Replace('__OUTPUT_VERSION__', $outputVersionExpression)
          $preflight = $preflight.Replace('__OUTPUT_SHOULD_RELEASE__', $outputShouldReleaseExpression)

          if ($release -notmatch '(?m)^jobs:\r?$') {
            throw 'Release workflow jobs block was not found.'
          }
          $release = [regex]::Replace($release, '(?m)^jobs:\r?$', ('jobs:' + "`n" + $preflight.TrimEnd()), 1)

          $release = [regex]::Replace(
            $release,
            '(?m)^  build:\r?\n    name: Build Package$',
            ("  build:`n    name: Build Package`n    needs: preflight`n    if: $shouldReleaseExpression"),
            1
          )

          # All checkout steps must use the exact commit validated by Quality Gate.
          $checkoutWithPattern = '(?m)^(?<indent>\s*)uses: actions/checkout@v7\.0\.1\r?\n(?<withindent>\s*)with:\r?\n'
          $release = [regex]::Replace(
            $release,
            $checkoutWithPattern,
            {
              param($m)
              $indent = $m.Groups['indent'].Value
              $withIndent = $m.Groups['withindent'].Value
              "$indent" + 'uses: actions/checkout@v7.0.1' + "`n" +
                "$withIndent" + 'with:' + "`n" +
                "$withIndent  ref: $headShaExpression" + "`n"
            }
          )
          $checkoutWithoutWithPattern = '(?m)^(?<indent>\s*)uses: actions/checkout@v7\.0\.1\r?\n(?!\s*with:)'
          $release = [regex]::Replace(
            $release,
            $checkoutWithoutWithPattern,
            {
              param($m)
              $indent = $m.Groups['indent'].Value
              "$indent" + 'uses: actions/checkout@v7.0.1' + "`n" +
                "$indent" + 'with:' + "`n" +
                "$indent  ref: $headShaExpression" + "`n"
            }
          )

          # Release notes and tag target must reference the tested commit.
          $oldGithubShaExpression = '$' + '{{ github.sha }}'
          $release = $release.Replace($oldGithubShaExpression, $headShaExpression)
          Write-RepoFile $releasePath $release

      - name: Commit prepared 1.1.4 release
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'No release preparation changes found.'
            exit 0
          }
          if ($LASTEXITCODE -ne 1) { exit $LASTEXITCODE }
          git commit -m 'chore(release): prepare RenderKit 1.1.4 [skip changelog]'
          git push origin HEAD:1.1.4
