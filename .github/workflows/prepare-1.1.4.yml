name: Prepare RenderKit 1.1.4

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - .github/workflows/prepare-1.1.4.yml

permissions:
  contents: write

jobs:
  prepare:
    if: ${{ github.event.pull_request.head.ref == '1.1.4' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout 1.1.4
        uses: actions/checkout@v7.0.1
        with:
          ref: 1.1.4
          fetch-depth: 0
          persist-credentials: true

      - name: Prepare corrective release
        run: |
          $ErrorActionPreference = 'Stop'
          $utf8NoBom = [System.Text.UTF8Encoding]::new($false)

          function Read-RepoFile([string]$Path) {
            [System.IO.File]::ReadAllText((Join-Path $env:GITHUB_WORKSPACE $Path))
          }

          function Write-RepoFile([string]$Path, [string]$Content) {
            [System.IO.File]::WriteAllText(
              (Join-Path $env:GITHUB_WORKSPACE $Path),
              $Content,
              $utf8NoBom
            )
          }

          $manifestPath = 'RenderKit.psd1'
          $manifest = Read-RepoFile $manifestPath
          $manifest = $manifest.Replace("ModuleVersion = '1.1.3'", "ModuleVersion = '1.1.4'")
          $releaseNotes = @(
            "            ReleaseNotes = @'",
            'Version 1.1.4 is a corrective release of the RenderKit 1.1.3 feature set:',
            '- Fixes stale release-version assertions and README metadata left behind by the 1.1.3 release cut.',
            '- Updates release-documentation validation for canonical Keep a Changelog version headings.',
            '- Contains no additional runtime feature changes beyond RenderKit 1.1.3.',
            "'@"
          ) -join "`n"
          $manifest = [regex]::Replace(
            $manifest,
            "(?s)            ReleaseNotes = @'\r?\n.*?\r?\n'@",
            $releaseNotes,
            1
          )
          Write-RepoFile $manifestPath $manifest

          $readmePath = 'README.md'
          $readme = Read-RepoFile $readmePath
          $readme = $readme.Replace('Current repository version: **1.1.2**', 'Current repository version: **1.1.4**')
          $readme = $readme.Replace('command exported by the 1.1.0 manifest', 'command exported by the 1.1.4 manifest')
          Write-RepoFile $readmePath $readme

          $backupTestPath = 'Tests/Backup/RenderKit.BackupConfigProfile.Tests.ps1'
          $backupTest = Read-RepoFile $backupTestPath
          $backupTest = $backupTest.Replace(
            '$upgrade.ModuleVersion | Should -Be ''1.1.2''',
            '$upgrade.ModuleVersion | Should -Be (Get-Module RenderKit).Version.ToString()'
          )
          Write-RepoFile $backupTestPath $backupTest

          $docsTestPath = 'Tests/Documentation/RenderKit.Documentation.Tests.ps1'
          $docsTest = Read-RepoFile $docsTestPath
          $docsTest = $docsTest.Replace(
            '$changelog | Should -Match "(?m)^## $version(?:\s|$)"',
            '$changelog | Should -Match "(?m)^## \[$version\](?:\s|$)"'
          )
          Write-RepoFile $docsTestPath $docsTest

          $changelogPath = 'CHANGELOG.md'
          $changelog = Read-RepoFile $changelogPath
          $releaseSection = @'
          ### Security

          ## [1.1.4] - 2026-08-07

          ### Fixed

          - Fixed stale release-version assertions and README metadata left at `1.1.2` after the `1.1.3` release cut.
          - Fixed release-documentation validation to recognize the canonical Keep a Changelog heading format (`## [version]`).

          ## [1.1.3] - 2026-07-31
          '@
          $pattern = '(?m)^### Security\r?\n\r?\n## \[1\.1\.3\] - 2026-07-31'
          $changelog = [regex]::Replace($changelog, $pattern, $releaseSection.TrimEnd(), 1)
          Write-RepoFile $changelogPath $changelog

      - name: Commit prepared 1.1.4 release
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- RenderKit.psd1 README.md CHANGELOG.md Tests/Backup/RenderKit.BackupConfigProfile.Tests.ps1 Tests/Documentation/RenderKit.Documentation.Tests.ps1
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'No release preparation changes found.'
            exit 0
          }
          if ($LASTEXITCODE -ne 1) { exit $LASTEXITCODE }
          git commit -m 'fix(release): prepare RenderKit 1.1.4 [skip changelog]'
          git push origin HEAD:1.1.4
